[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "local-downloads-organizer"
version = "1.0.0"
description = "Local desktop file organizer with preview and recoverable moves"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "PySide6==6.11.2",
    "winrt-runtime==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.ApplicationModel==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation==3.2.1; sys_platform == 'win32'",
]

[project.gui-scripts]
downloads-organizer = "organizer.app:main"

[project.urls]
Repository = "https://github.com/kashnordeen/downloads-organizer"
Issues = "https://github.com/kashnordeen/downloads-organizer/issues"

[tool.setuptools.packages.find]
include = ["organizer*"]

[tool.setuptools.package-data]
organizer = ["assets/*.png", "assets/*.svg"]
