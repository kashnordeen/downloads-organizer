name: Desktop builds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/media/**', 'VALIDATION.md']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.7'
      - run: python packaging/sources.py
      - run: |
          cp docs/DEPENDENCIES.md dist/corresponding-source/DEPENDENCIES.md
          cp docs/BUILDING.md dist/corresponding-source/BUILDING.md
          tar -czf dist/corresponding-source-6.11.2.tar.gz -C dist corresponding-source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-notices
          path: licenses/upstream/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: corresponding-source
          path: dist/corresponding-source-6.11.2.tar.gz
          compression-level: 0
  build:
    needs: sources
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: windows-x64
          - os: ubuntu-22.04
            name: linux-x64
          - os: macos-15-intel
            name: macos-x64
          - os: macos-15
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.7'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/build-requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dependency-notices
          path: licenses/upstream
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1 libegl1 libopengl0 libfontconfig1 libdbus-1-3 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libgtk-3-0 libssl3 libsqlite3-0 libbz2-1.0 liblzma5 libreadline8 libexpat1 zlib1g libwayland-client0 libwayland-cursor0 libwayland-egl1 libgssapi-krb5-2
      - name: Install pinned dependencies
        run: python -m pip install -e . -r packaging/runtime-requirements.txt -r packaging/build-requirements.txt pip-audit
      - name: Tests and dependency audit
        timeout-minutes: 5
        run: |
          python -m compileall -q organizer packaging tests
          python -m unittest discover -s tests -v
          python -m pip_audit -r packaging/runtime-requirements.txt -r packaging/build-requirements.txt
      - name: Install verified compiler on Windows build runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Join-Path $env:RUNNER_TEMP 'inno-setup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $compiler
          if ((Get-FileHash $compiler -Algorithm SHA256).Hash -ne '0362A383ED217D4C4239B5933866DD96D3EB2102737DA92F80F6057A4B40DF2F') { throw 'Compiler checksum mismatch' }
          if ((Get-AuthenticodeSignature $compiler).Status -ne 'Valid') { throw 'Compiler signature invalid' }
          $compilerDir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $process = Start-Process -FilePath $compiler -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$compilerDir") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Compiler installation failed' }
          python packaging/build.py "$compilerDir\ISCC.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Build macOS
        if: runner.os == 'macOS'
        run: python packaging/build.py
      - name: Build Linux with X11
        if: runner.os == 'Linux'
        run: QT_QPA_PLATFORM=xcb xvfb-run -a python packaging/build.py
      - name: Windows installation and upgrade check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'Installed Organizer'
          $setup = (Get-ChildItem dist/release/*-setup.exe).FullName
          $dataDir = python -c "from PySide6.QtCore import QCoreApplication, QStandardPaths; app=QCoreApplication([]); app.setOrganizationName('LocalOrganizer'); app.setApplicationName('DownloadsOrganizer'); print(QStandardPaths.writableLocation(QStandardPaths.AppDataLocation))"
          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
          $sentinel = Join-Path $dataDir 'upgrade-retention.txt'
          Set-Content -LiteralPath $sentinel -Value 'Keep settings and history'
          1..2 | ForEach-Object {
            $process = Start-Process $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$target`"") -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw 'Install/upgrade failed' }
            $process = Start-Process "$target\DownloadsOrganizer.exe" -ArgumentList @('--verify-bundle', "`"$env:RUNNER_TEMP\installed-check.json`"") -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw 'Installed app check failed' }
            if ((Get-Content -LiteralPath $sentinel) -ne 'Keep settings and history') { throw 'Upgrade removed user data' }
          }
          $process = Start-Process "$target\unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Uninstall failed' }
          if ((Get-Content -LiteralPath $sentinel) -ne 'Keep settings and history') { throw 'Uninstall removed user data' }
      - name: Linux package installation check
        if: runner.os == 'Linux'
        run: |
          sudo dpkg -i dist/release/*.deb
          QT_QPA_PLATFORM=xcb xvfb-run -a /opt/downloads-organizer/DownloadsOrganizer --verify-bundle "$RUNNER_TEMP/installed-check.json"
          sudo dpkg -r downloads-organizer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: checks-${{ matrix.name }}
          path: |
            dist/bundle-check.*
            ${{ runner.temp }}/installed-check.*
